name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-norme-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependances (readline, norminette)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreadline-dev
          python3 -m pip install --quiet --user norminette
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compilation (make re, -Wall -Wextra -Werror)
        run: make re

      - name: Pas de relink inutile
        run: |
          make 2>&1 | tee relink.log
          if grep -q "compiled" relink.log; then
            echo "::error::make relance une compilation alors que rien n'a change"
            exit 1
          fi

      - name: Norminette
        run: |
          norminette src/ includes/ libft/ | tee norm.log
          if grep -q "Error" norm.log; then
            echo "::error::erreurs de norminette"
            exit 1
          fi

      - name: Tests unitaires et integration
        run: |
          fail=0
          for t in tests/unit/test_*.sh tests/integration/test_*.sh; do
            echo "::group::$t"
            if ! bash "$t"; then
              echo "::error file=$t::suite en echec"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
